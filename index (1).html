    "AIzaSyBsF_rzmS_rz3Bj-XQxdY9Dr3Z-yK0zJ6Y",

    "G-3J4NENHZGF"
};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


const auth =
  getAuth(app);


/*
  สำคัญ:
  ทุกคนใช้ปฏิทินชุดเดียวกัน
*/

const sharedDoc =
  doc(
    db,
    "tradeCalendar",
    "shared"
  );


/* =========================================================
   CONSTANTS
   ========================================================= */

const THAI_MONTHS = [

  "มกราคม",
  "กุมภาพันธ์",
  "มีนาคม",
  "เมษายน",
  "พฤษภาคม",
  "มิถุนายน",
  "กรกฎาคม",
  "สิงหาคม",
  "กันยายน",
  "ตุลาคม",
  "พฤศจิกายน",
  "ธันวาคม"

];


const THAI_DOW = [
  "อา",
  "จ",
  "อ",
  "พ",
  "พฤ",
  "ศ",
  "ส"
];


/* =========================================================
   STATE
   ========================================================= */

const state = {

  data: {},

  capital: 0,

  view: new Date(),

  selectedDay: null,

  sheetMode: "profit"

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const sheet =
  document.getElementById("sheet");


const backdrop =
  document.getElementById("backdrop");


const amountInput =
  document.getElementById("amountInput");


const btnProfit =
  document.getElementById("btnProfit");


const btnLoss =
  document.getElementById("btnLoss");


const capitalInput =
  document.getElementById("capitalInput");


const syncStatus =
  document.getElementById("syncStatus");


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  text,
  type = ""
) {

  syncStatus.textContent =
    text;

  syncStatus.className =
    "sync-status " + type;

}


/* =========================================================
   MONTH KEY
   ========================================================= */

function monthKey(date) {

  return (
    date.getFullYear() +
    "-" +
    date.getMonth()
  );

}


/* =========================================================
   MONEY
   ========================================================= */

function fmtMoney(n) {

  n = Number(n) || 0;

  const sign =
    n < 0
      ? "-"
      : n > 0
        ? "+"
        : "";

  const abs =
    Math.abs(n);

  return (
    sign +
    "$" +
    abs.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:
          abs % 1 === 0 ? 0 : 2,

        maximumFractionDigits:
          2
      }
    )
  );

}


/* =========================================================
   MONTH TOTAL
   ========================================================= */

function monthTotal(date) {

  const key =
    monthKey(date);

  const entries =
    state.data[key] || {};

  let total = 0;

  Object.keys(entries)
    .forEach(day => {

      total +=
        Number(entries[day]) || 0;

    });

  return total;

}


/* =========================================================
   ALL TIME TOTAL
   ========================================================= */

function allTimeTotal() {

  let total = 0;

  Object.keys(state.data)
    .forEach(month => {

      const entries =
        state.data[month];

      Object.keys(entries)
        .forEach(day => {

          total +=
            Number(entries[day]) || 0;

        });

    });

  return total;

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  const date =
    state.view;


  document.getElementById(
    "monthLabel"
  ).textContent =

    THAI_MONTHS[
      date.getMonth()
    ] +
    " " +
    (
      date.getFullYear() + 543
    );


  document.getElementById(
    "rangeLabel"
  ).textContent =
    "ปฏิทินเทรด";


  /*
    CAPITAL
  */

  if (
    document.activeElement !==
    capitalInput
  ) {

    capitalInput.value =
      state.capital
        ? state.capital
            .toLocaleString("en-US")
        : "";

  }


  /*
    STATS
  */

  const mTotal =
    monthTotal(date);


  const aTotal =
    allTimeTotal();


  const pct =
    state.capital > 0
      ? (
          mTotal /
          state.capital *
          100
        )
      : null;


  /*
    MONTH
  */

  const statMonth =
    document.getElementById(
      "statMonth"
    );


  statMonth
    .querySelector(".value")
    .textContent =
      fmtMoney(mTotal);


  statMonth.className =
    "stat" +
    (
      mTotal > 0
        ? " profit"
        : mTotal < 0
          ? " loss"
          : ""
    );


  /*
    PERCENT
  */

  const statPercent =
    document.getElementById(
      "statPercent"
    );


  const pctVal =
    statPercent
      .querySelector(".value");


  const pctSub =
    document.getElementById(
      "statPercentSub"
    );


  if (pct === null) {

    pctVal.textContent =
      "-";

    pctSub.textContent =
      "ใส่เงินทุนเริ่มต้น";

  } else {

    pctVal.textContent =
      (
        pct >= 0 ? "+" : ""
      ) +
      pct.toFixed(2) +
      "%";


    pctSub.textContent =
      "จากเงินทุน $" +
      state.capital
        .toLocaleString("en-US");

  }


  statPercent.className =
    "stat" +
    (
      pct > 0
        ? " profit"
        : pct < 0
          ? " loss"
          : ""
    );


  /*
    TOTAL
  */

  const statTotal =
    document.getElementById(
      "statTotal"
    );


  statTotal
    .querySelector(".value")
    .textContent =
      fmtMoney(aTotal);


  statTotal.className =
    "stat" +
    (
      aTotal > 0
        ? " profit"
        : aTotal < 0
          ? " loss"
          : ""
    );


  renderCalendar(date);

}


/* =========================================================
   CALENDAR
   ========================================================= */

function renderCalendar(date) {

  const dowEl =
    document.getElementById("dow");


  dowEl.innerHTML = "";


  THAI_DOW.forEach(day => {

    const el =
      document.createElement("div");


    el.textContent =
      day;


    dowEl.appendChild(el);

  });


  const grid =
    document.getElementById("grid");


  grid.innerHTML = "";


  const year =
    date.getFullYear();


  const month =
    date.getMonth();


  const firstDay =
    new Date(
      year,
      month,
      1
    ).getDay();


  const daysInMonth =
    new Date(
      year,
      month + 1,
      0
    ).getDate();


  const key =
    monthKey(date);


  const entries =
    state.data[key] || {};


  const today =
    new Date();


  const isCurrentMonth =

    today.getFullYear() ===
      year &&

    today.getMonth() ===
      month;


  /*
    EMPTY CELLS
  */

  for (
    let i = 0;
    i < firstDay;
    i++
  ) {

    const empty =
      document.createElement("div");


    empty.className =
      "cell empty";


    grid.appendChild(empty);

  }


  /*
    DAYS
  */

  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const cell =
      document.createElement("div");


    cell.className =
      "cell";


    /*
      TODAY
    */

    if (
      isCurrentMonth &&
      today.getDate() === day
    ) {

      cell.classList.add(
        "today"
      );

    }


    /*
      ENTRY
    */

    const amt =
      Number(entries[day]);


    if (
      entries[day] !== undefined &&
      !isNaN(amt)
    ) {

      cell.classList.add(
        amt >= 0
          ? "has-profit"
          : "has-loss"
      );

    }


    /*
      DAY NUMBER
    */

    const dEl =
      document.createElement("div");


    dEl.className =
      "d";


    dEl.textContent =
      day;


    cell.appendChild(dEl);


    /*
      AMOUNT
    */

    if (
      entries[day] !== undefined &&
      !isNaN(amt)
    ) {

      const aEl =
        document.createElement("div");


      aEl.className =
        "amt";


      aEl.textContent =
        fmtMoney(amt);


      cell.appendChild(aEl);

    }


    /*
      CLICK
    */

    cell.addEventListener(
      "click",
      function() {

        openSheet(day);

      }
    );


    grid.appendChild(cell);

  }

}


/* =========================================================
   SHEET MODE
   ========================================================= */

function setMode(mode) {

  state.sheetMode =
    mode;


  btnProfit.classList.toggle(
    "active",
    mode === "profit"
  );


  btnLoss.classList.toggle(
    "active",
    mode === "loss"
  );

}


/* =========================================================
   OPEN SHEET
   ========================================================= */

function openSheet(day) {

  state.selectedDay =
    day;


  const date =
    state.view;


  const key =
    monthKey(date);


  const existing =
    (
      state.data[key] || {}
    )[day];


  document.getElementById(
    "sheetTitle"
  ).textContent =

    "วันที่ " +
    day +
    " " +
    THAI_MONTHS[
      date.getMonth()
    ] +
    " " +
    (
      date.getFullYear() + 543
    );


  if (
    typeof existing ===
    "number"
  ) {

    setMode(
      existing >= 0
        ? "profit"
        : "loss"
    );


    amountInput.value =
      Math.abs(existing)
        .toString();

  } else {

    setMode("profit");

    amountInput.value = "";

  }


  sheet.classList.add(
    "open"
  );


  backdrop.classList.add(
    "open"
  );


  setTimeout(
    function() {

      amountInput.focus();

    },
    250
  );

}


/* =========================================================
   CLOSE SHEET
   ========================================================= */

function closeSheet() {

  sheet.classList.remove(
    "open"
  );


  backdrop.classList.remove(
    "open"
  );


  state.selectedDay =
    null;

}


/* =========================================================
   SAVE FIREBASE
   ========================================================= */

async function saveToFirebase() {

  try {

    setStatus(
      "กำลังบันทึก...",
      ""
    );


    await setDoc(
      sharedDoc,
      {
        data: state.data,

        capital:
          Number(state.capital) || 0,

        updatedAt:
          Date.now()
      },
      {
        merge: true
      }
    );


    setStatus(
      "ซิงก์แล้ว",
      "online"
    );


  } catch (error) {

    console.error(
      "Firebase save error:",
      error
    );


    setStatus(
      "บันทึกไม่สำเร็จ",
      "error"
    );


    alert(
      "ไม่สามารถบันทึกข้อมูลได้\n\n" +
      error.message
    );

  }

}


/* =========================================================
   REALTIME FIREBASE
   ========================================================= */

function listenToFirebase() {

  onSnapshot(

    sharedDoc,

    function(snapshot) {

      if (
        snapshot.exists()
      ) {

        const data =
          snapshot.data();


        state.data =
          data.data || {};


        state.capital =
          Number(
            data.capital
          ) || 0;


      } else {

        /*
          ถ้ายังไม่มีข้อมูล
          สร้างข้อมูลเริ่มต้น
        */

        state.data = {};

        state.capital = 0;


        saveToFirebase();

      }


      render();


      setStatus(
        "ซิงก์แล้ว",
        "online"
      );

    },


    function(error) {

      console.error(
        "Firebase realtime error:",
        error
      );


      setStatus(
        "เชื่อมต่อไม่ได้",
        "error"
      );

    }

  );

}


/* =========================================================
   PROFIT BUTTON
   ========================================================= */

btnProfit.addEventListener(
  "click",
  function() {

    setMode("profit");

  }
);


/* =========================================================
   LOSS BUTTON
   ========================================================= */

btnLoss.addEventListener(
  "click",
  function() {

    setMode("loss");

  }
);


/* =========================================================
   BACKDROP
   ========================================================= */

backdrop.addEventListener(
  "click",
  closeSheet
);


/* =========================================================
   CANCEL
   ========================================================= */

document.getElementById(
  "btnCancel"
).addEventListener(
  "click",
  closeSheet
);


/* =========================================================
   SAVE DAY
   ========================================================= */

document.getElementById(
  "btnSave"
).addEventListener(
  "click",
  async function() {

    if (
      state.selectedDay ===
      null
    ) {

      return;

    }


    const raw =
      amountInput.value
        .replace(/,/g, "")
        .trim();


    let val =
      parseFloat(raw);


    if (
      isNaN(val) ||
      val === 0
    ) {

      closeSheet();

      return;

    }


    val =
      Math.abs(val) *
      (
        state.sheetMode ===
        "loss"
          ? -1
          : 1
      );


    const key =
      monthKey(
        state.view
      );


    if (
      !state.data[key]
    ) {

      state.data[key] = {};

    }


    state.data[key][
      state.selectedDay
    ] = val;


    closeSheet();


    render();


    await saveToFirebase();

  }
);


/* =========================================================
   DELETE DAY
   ========================================================= */

document.getElementById(
  "btnDelete"
).addEventListener(
  "click",
  async function() {

    if (
      state.selectedDay ===
      null
    ) {

      return;

    }


    const key =
      monthKey(
        state.view
      );


    if (
      state.data[key]
    ) {

      delete state.data[key][
        state.selectedDay
      ];


      if (
        Object.keys(
          state.data[key]
        ).length === 0
      ) {

        delete state.data[key];

      }

    }


    closeSheet();


    render();


    await saveToFirebase();

  }
);


/* =========================================================
   CAPITAL
   ========================================================= */

capitalInput.addEventListener(
  "change",
  async function() {

    const raw =
      capitalInput.value
        .replace(/,/g, "")
        .trim();


    const val =
      parseFloat(raw);


    state.capital =
      isNaN(val)
        ? 0
        : val;


    render();


    await saveToFirebase();

  }
);


/* =========================================================
   PREVIOUS MONTH
   ========================================================= */

document.getElementById(
  "prevBtn"
).addEventListener(
  "click",
  function() {

    state.view =
      new Date(
        state.view.getFullYear(),
        state.view.getMonth() - 1,
        1
      );


    render();

  }
);


/* =========================================================
   NEXT MONTH
   ========================================================= */

document.getElementById(
  "nextBtn"
).addEventListener(
  "click",
  function() {

    state.view =
      new Date(
        state.view.getFullYear(),
        state.view.getMonth() + 1,
        1
      );


    render();

  }
);


/* =========================================================
   RESET MONTH
   ========================================================= */

document.getElementById(
  "resetBtn"
).addEventListener(
  "click",
  async function() {

    const key =
      monthKey(
        state.view
      );


    if (
      state.data[key] &&
      Object.keys(
        state.data[key]
      ).length > 0
    ) {

      if (
        confirm(
          "ล้างข้อมูลทั้งหมดของเดือนนี้?"
        )
      ) {

        delete state.data[key];


        render();


        await saveToFirebase();

      }

    }

  }
);


/* =========================================================
   ENTER KEY IN AMOUNT
   ========================================================= */

amountInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      document.getElementById(
        "btnSave"
      ).click();

    }

  }
);


/* =========================================================
   START FIREBASE
   ========================================================= */

async function startFirebase() {

  try {

    setStatus(
      "กำลังเข้าสู่ระบบ...",
      ""
    );


    /*
      Anonymous Authentication
    */

    await signInAnonymously(
      auth
    );


    setStatus(
      "กำลังซิงก์ข้อมูล...",
      ""
    );


    /*
      รับข้อมูลแบบ Real-time
    */

    listenToFirebase();


  } catch (error) {

    console.error(
      "Firebase startup error:",
      error
    );


    setStatus(
      "เชื่อมต่อ Firebase ไม่ได้",
      "error"
    );


    alert(
      "เชื่อมต่อ Firebase ไม่สำเร็จ\n\n" +
      error.message
    );

  }

}


/* =========================================================
   INITIAL RENDER
   ========================================================= */

render();


/* =========================================================
   START
   ========================================================= */

startFirebase();

</script>

</body>
</html>
