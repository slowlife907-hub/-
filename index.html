<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปฏิทินเทรด</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,"Noto Sans Thai",sans-serif;
    background:#0b0f14;
    color:#e8edf5;
  }
  button,input{font:inherit}
  button{cursor:pointer}
  .wrap{max-width:720px;margin:auto;padding:42px 16px 80px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
  .eyebrow{font-size:12px;color:#7f8da3;margin-bottom:5px}
  h1{font-size:22px;margin:0 0 4px;font-weight:700}
  .status{font-size:12px;color:#35d39b}
  .trash{
    width:40px;height:40px;border:1px solid #27303d;border-radius:12px;
    background:#141a22;color:#778397;font-size:18px
  }
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card{
    background:#151b23;border:1px solid #27303d;border-radius:14px;padding:13px 12px;
    min-height:86px
  }
  .label{font-size:12px;color:#7f8da3;margin-bottom:7px}
  .value{font-size:18px;font-weight:700;color:#35d39b}
  .sub{font-size:11px;color:#6f7c8e;margin-top:6px}
  .capital-box{
    margin-top:14px;background:#151b23;border:1px solid #27303d;border-radius:14px;
    padding:10px 12px
  }
  .capital-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .capital-label{font-size:12px;color:#7f8da3}
  .capital-input{
    width:150px;background:transparent;border:0;outline:0;text-align:right;
    color:#e8edf5;font-weight:700;font-size:16px
  }
  .rate-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-top:8px;padding-top:8px;border-top:1px solid #222a35
  }
  .rate-input{
    width:100px;background:#11161d;border:1px solid #2a3442;border-radius:8px;
    color:#e8edf5;padding:5px 7px;text-align:right;outline:0
  }
  .month-head{display:flex;justify-content:space-between;align-items:center;margin:16px 0 9px}
  .month-title{font-size:18px;font-weight:700}
  .nav{display:flex;gap:7px}
  .nav button{
    width:39px;height:39px;border-radius:11px;border:1px solid #27303d;
    background:#141a22;color:#8995a6;font-size:20px
  }
  .calendar{
    background:#151b23;border:1px solid #27303d;border-radius:20px;padding:12px 10px 14px;
    overflow:hidden
  }
  .week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .week{margin-bottom:7px}
  .week div{text-align:center;font-size:10px;color:#68768a;padding:5px 0}
  .day{
    min-height:96px;border:1px solid transparent;border-radius:11px;
    background:#1b2330;color:#94a1b4;display:flex;flex-direction:column;
    align-items:center;justify-content:center;position:relative;
    transition:.15s
  }
  .day:hover{border-color:#334052}
  .day.empty{background:transparent}
  .num{font-size:14px;font-weight:700}
  .profit{font-size:12px;margin-top:5px;color:#35d39b;font-weight:700}
  .loss{color:#ff6f7b}
  .today{border-color:#c89b2d;background:#193635}
  .selected{box-shadow:inset 0 0 0 1px #5c6878}
  .total-line{
    margin-top:10px;font-size:11px;color:#778397;text-align:right
  }
  .sheet-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10
  }
  .sheet{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:min(720px,100%);background:#151b23;border:1px solid #27303d;
    border-bottom:0;border-radius:20px 20px 0 0;padding:18px;z-index:11;display:none
  }
  .sheet h2{font-size:18px;margin:0 0 4px}
  .sheet-date{font-size:12px;color:#7f8da3;margin-bottom:15px}
  .amount{
    width:100%;height:52px;background:#0f141b;border:1px solid #2b3543;
    border-radius:12px;color:#fff;font-size:22px;text-align:center;outline:none
  }
  .sheet-actions{display:flex;gap:8px;margin-top:12px}
  .sheet-actions button{
    flex:1;height:44px;border:0;border-radius:11px;font-weight:700
  }
  .save{background:#35d39b;color:#07120e}
  .cancel{background:#252e3a;color:#b9c2cf}
  .delete{background:#352126;color:#ff8791}
  .loading{
    position:fixed;inset:0;background:#0b0f14;display:flex;align-items:center;
    justify-content:center;color:#8c99aa;z-index:30
  }
  @media(max-width:560px){
    .wrap{padding-top:25px}
    .cards{gap:7px}
    .card{padding:11px 9px}
    .value{font-size:15px}
    .day{min-height:65px}
    .profit{font-size:10px}
    .calendar{padding:8px 5px}
  }
</style>
</head>
<body>

<div id="loading" class="loading">กำลังเชื่อมต่อ...</div>

<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">บันทึกผลการเทรด</div>
      <h1>ปฏิทินเทรด</h1>
      <div id="status" class="status">กำลังเชื่อมต่อ</div>
    </div>
    <button class="trash" id="resetBtn" title="ล้างข้อมูลทั้งหมด">🗑</button>
  </div>

  <div class="cards">
    <div class="card">
      <div class="label">ยอดเดือนนี้</div>
      <div class="value" id="monthProfit">$0.00</div>
      <div class="sub" id="monthBaht">฿0.00</div>
    </div>
    <div class="card">
      <div class="label">% เปลี่ยนแปลง</div>
      <div class="value" id="monthPercent">+0.00%</div>
      <div class="sub" id="percentBase">จากเงินทุน ฿0.00</div>
    </div>
    <div class="card">
      <div class="label">ยอดสะสมทั้งหมด</div>
      <div class="value" id="allProfit">$0.00</div>
      <div class="sub" id="allBaht">฿0.00</div>
    </div>
  </div>

  <div class="card" style="margin-top:10px">
    <div class="label">ยอดเงินรวมทั้งหมด</div>
    <div class="value" id="grandTotal">$0.00</div>
    <div class="sub" id="grandBaht">฿0.00</div>
  </div>

  <div class="capital-box">
    <div class="capital-row">
      <div class="capital-label">เงินทุนเริ่มต้น ($)</div>
      <input id="capitalInput" class="capital-input" type="number" step="0.01" min="0" value="200">
    </div>
    <div class="rate-row">
      <div class="capital-label">อัตราแลกเปลี่ยน 1 USD = บาท</div>
      <input id="rateInput" class="rate-input" type="number" step="0.01" min="0.01" value="32.50">
    </div>
  </div>

  <div class="month-head">
    <div class="month-title" id="monthTitle"></div>
    <div class="nav">
      <button id="prevBtn">‹</button>
      <button id="nextBtn">›</button>
    </div>
  </div>

  <div class="calendar">
    <div class="week">
      <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
    </div>
    <div class="days" id="days"></div>
    <div class="total-line" id="monthTotalLine">รวมเดือนนี้: $0.00 / ฿0.00</div>
  </div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h2>บันทึกผลการเทรด</h2>
  <div class="sheet-date" id="sheetDate"></div>
  <input class="amount" id="amountInput" type="number" step="0.01" placeholder="เช่น 25 หรือ -10">
  <div class="sheet-actions">
    <button class="cancel" id="cancelBtn">ยกเลิก</button>
    <button class="delete" id="deleteBtn">ลบ</button>
    <button class="save" id="saveBtn">บันทึก</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsF_rzmS_rz3Bj-XQxdY9Dr3Z-yK0zJ6Y",
  authDomain: "trade-66eb9.firebaseapp.com",
  projectId: "trade-66eb9",
  storageBucket: "trade-66eb9.firebasestorage.app",
  messagingSenderId: "624250473489",
  appId: "1:624250473489:web:8af209c0753a9a738475b0",
  measurementId: "G-3J4NENHZGF"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const sharedRef = doc(db, "tradeCalendar", "shared");

let state = {
  trades: {},
  capital: 200,
  rate: 32.50
};

let current = new Date();
current.setDate(1);
let selectedKey = null;
let unsubscribe = null;
let saveTimer = null;

const $ = id => document.getElementById(id);

function moneyUSD(n){
  const sign = n > 0 ? "+" : n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toFixed(2);
}
function baht(n){
  return "฿" + Number(n || 0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function keyOf(y,m,d){
  return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function monthKey(){
  return `${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,"0")}`;
}
function monthTotal(){
  const prefix = monthKey() + "-";
  return Object.entries(state.trades)
    .filter(([k]) => k.startsWith(prefix))
    .reduce((s,[,v]) => s + Number(v || 0), 0);
}
function allTotal(){
  return Object.values(state.trades).reduce((s,v) => s + Number(v || 0), 0);
}
function fmtThaiMonth(d){
  const months = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
                  "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  return `${months[d.getMonth()]} ${d.getFullYear()+543}`;
}

function render(){
  const mt = monthTotal();
  const at = allTotal();
  const capital = Number(state.capital || 0);
  const rate = Number(state.rate || 32.5);
  const grand = capital + at;
  const pct = capital ? (mt / capital) * 100 : 0;

  $("monthTitle").textContent = fmtThaiMonth(current);
  $("monthProfit").textContent = moneyUSD(mt);
  $("monthBaht").textContent = baht(mt * rate);

  $("monthPercent").textContent = (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%";
  $("percentBase").textContent = "จากเงินทุน " + baht(capital * rate);

  $("allProfit").textContent = moneyUSD(at);
  $("allBaht").textContent = baht(at * rate);

  $("grandTotal").textContent = moneyUSD(grand);
  $("grandBaht").textContent = baht(grand * rate);

  $("capitalInput").value = capital;
  $("rateInput").value = rate;

  $("monthTotalLine").textContent =
    `รวมเดือนนี้: ${moneyUSD(mt)} / ${baht(mt * rate)}`;

  const y = current.getFullYear();
  const m = current.getMonth();
  const first = new Date(y,m,1).getDay();
  const last = new Date(y,m+1,0).getDate();
  const days = $("days");
  days.innerHTML = "";

  for(let i=0;i<first;i++){
    const e=document.createElement("div");
    e.className="day empty";
    days.appendChild(e);
  }

  const today = new Date();
  for(let d=1;d<=last;d++){
    const key=keyOf(y,m,d);
    const val=Number(state.trades[key] || 0);
    const e=document.createElement("button");
    e.className="day";
    e.type="button";
    if(
      today.getFullYear()===y &&
      today.getMonth()===m &&
      today.getDate()===d
    ) e.classList.add("today");
    if(selectedKey===key) e.classList.add("selected");

    const num=document.createElement("div");
    num.className="num";
    num.textContent=d;
    e.appendChild(num);

    if(val!==0){
      const p=document.createElement("div");
      p.className="profit " + (val<0 ? "loss" : "");
      p.textContent=moneyUSD(val);
      e.appendChild(p);

      const b=document.createElement("div");
      b.style.cssText="font-size:9px;margin-top:2px;color:#7f8da3";
      b.textContent=baht(val*rate);
      e.appendChild(b);
    }

    e.addEventListener("click",()=>openSheet(key,y,m,d,val));
    days.appendChild(e);
  }
}

function openSheet(key,y,m,d,val){
  selectedKey=key;
  $("sheetDate").textContent=`${d} ${fmtThaiMonth(new Date(y,m,1))}`;
  $("amountInput").value=val || "";
  $("sheetBg").style.display="block";
  $("sheet").style.display="block";
  $("amountInput").focus();
}
function closeSheet(){
  selectedKey=null;
  $("sheetBg").style.display="none";
  $("sheet").style.display="none";
  render();
}

async function saveCloud(){
  if(!auth.currentUser) return;
  $("status").textContent="กำลังบันทึก...";
  await setDoc(sharedRef,{
    trades: state.trades,
    capital: Number(state.capital),
    rate: Number(state.rate),
    updatedAt: Date.now()
  },{merge:true});
  $("status").textContent="ซิงก์แล้ว";
}

$("saveBtn").addEventListener("click",async()=>{
  if(!selectedKey) return;
  const value=Number($("amountInput").value);
  if($("amountInput").value.trim()==="") delete state.trades[selectedKey];
  else state.trades[selectedKey]=value;
  render();
  closeSheet();
  try{await saveCloud()}catch(e){
    console.error(e);
    $("status").textContent="บันทึกไม่สำเร็จ";
  }
});

$("deleteBtn").addEventListener("click",async()=>{
  if(!selectedKey) return;
  delete state.trades[selectedKey];
  closeSheet();
  try{await saveCloud()}catch(e){$("status").textContent="ลบไม่สำเร็จ";}
});

$("cancelBtn").addEventListener("click",closeSheet);
$("sheetBg").addEventListener("click",closeSheet);

$("prevBtn").addEventListener("click",()=>{
  current.setMonth(current.getMonth()-1);
  render();
});
$("nextBtn").addEventListener("click",()=>{
  current.setMonth(current.getMonth()+1);
  render();
});

$("capitalInput").addEventListener("input",()=>{
  state.capital=Number($("capitalInput").value)||0;
  render();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveCloud().catch(()=>{}),700);
});

$("rateInput").addEventListener("input",()=>{
  state.rate=Number($("rateInput").value)||32.5;
  render();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveCloud().catch(()=>{}),700);
});

$("resetBtn").addEventListener("click",async()=>{
  const ok=confirm("ต้องการล้างข้อมูลการเทรดทั้งหมดของทุกคนหรือไม่?\nข้อมูลในปฏิทินจะถูกลบทั้งหมด");
  if(!ok) return;
  state.trades={};
  render();
  try{await saveCloud()}catch(e){$("status").textContent="ล้างข้อมูลไม่สำเร็จ";}
});

onAuthStateChanged(auth,user=>{
  if(!user) return;
  $("status").textContent="เชื่อมต่อแล้ว";
  if(unsubscribe) unsubscribe();
  unsubscribe=onSnapshot(sharedRef,(snap)=>{
    if(snap.exists()){
      const d=snap.data();
      state.trades=d.trades && typeof d.trades==="object" ? d.trades : {};
      state.capital=Number(d.capital ?? 200);
      state.rate=Number(d.rate ?? 32.5);
    }
    render();
    $("loading").style.display="none";
    $("status").textContent="ซิงก์แล้ว";
  },err=>{
    console.error(err);
    $("status").textContent="เชื่อมต่อฐานข้อมูลไม่ได้";
    $("loading").style.display="none";
  });
});

signInAnonymously(auth).catch(err=>{
  console.error(err);
  $("loading").textContent="Firebase: เปิด Anonymous Authentication ก่อน";
  $("status").textContent="เชื่อมต่อไม่ได้";
});
</script>
</body>
</html>
